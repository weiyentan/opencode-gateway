---
# Kubernetes Deployment for the OpenCode Gateway Kafka Consumer.
#
# This consumer reads usage records from the ``opencode-usage`` Kafka topic
# and POSTs them to the Gateway's ``/ingest`` endpoint.  It runs as a
# separate container in the same namespace.
#
#   kubectl apply -f k8s/consumer-deployment.yaml
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-usage-consumer
  labels:
    app: opencode-gateway
    component: usage-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode-gateway
      component: usage-consumer
  template:
    metadata:
      labels:
        app: opencode-gateway
        component: usage-consumer
    spec:
      containers:
        - name: opencode-usage-consumer
          image: ${REGISTRY}/opencode-gateway-consumer:${IMAGE_TAG}
          command: ["python", "-m", "app.consumer"]
          env:
            - name: GATEWAY_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: opencode-gateway-secrets
                  key: gateway-base-url
            - name: GATEWAY_COLLECTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencode-gateway-secrets
                  key: gateway-collector-token
            - name: GATEWAY_KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: opencode-gateway-secrets
                  key: kafka-brokers
            - name: GATEWAY_KAFKA_TOPIC
              value: "opencode-usage"
            - name: GATEWAY_KAFKA_DLQ_TOPIC
              value: "opencode-usage-dlq"
            - name: GATEWAY_CONSUMER_GROUP_ID
              value: "opencode-gateway"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,sys; os.kill(1,0); sys.exit(0 if b'app.consumer' in open('/proc/1/cmdline','rb').read() else 1)"
            initialDelaySeconds: 30
            periodSeconds: 30
      restartPolicy: Always
