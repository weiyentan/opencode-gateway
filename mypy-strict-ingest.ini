# Isolated strict-mypy check for the usage-ingestion module (issue #829).
#
# This mirrors the shipped `[tool.mypy]` configuration in `pyproject.toml`
# EXCEPT that the `app.api.ingest` entry is removed from the
# `[[tool.mypy.overrides]]` `ignore_errors` list.  It lets the
# collector-auth / empty-heartbeat / request-validation / per-record-result
# slice be verified independently while the persistence (#830) and
# enrichment (#831) slices still carry the shipped module exemption.
#
# This file is a verification aid, NOT a CI gate.  Keep it in sync with
# `pyproject.toml`: it must remain exactly the shipped configuration minus
# the `app.api.ingest` override.  Do not add per-line ignores here.
#
# Usage:
#   python -m mypy --config-file mypy-strict-ingest.ini app/api/ingest.py
#
# See `docs/ingest-typing/remaining-diagnostics.md` for the expected
# remaining diagnostics and which later slice owns each one.

[mypy]
python_version = 3.12
strict = true
ignore_missing_imports = true
disable_error_code = type-arg, unused-ignore

[mypy-app.core.reconciliation]
ignore_errors = true
[mypy-afk_outcomes.closure_episodes]
ignore_errors = true
[mypy-afk_outcomes.repository]
ignore_errors = true
[mypy-afk_outcomes.repository.crud]
ignore_errors = true
[mypy-afk_outcomes.repository.executions]
ignore_errors = true
[mypy-afk_outcomes.repository.lifecycle]
ignore_errors = true
[mypy-afk_outcomes.repository.closure_projection]
ignore_errors = true
[mypy-afk_outcomes.providers.gitlab]
ignore_errors = true
[mypy-app.api.usage]
ignore_errors = true
[mypy-app.core.factory]
ignore_errors = true
[mypy-app.core.identity]
ignore_errors = true
[mypy-app.consumer.afk_consumer]
ignore_errors = true
# app.api.ingest intentionally NOT ignored — the isolated check must see it.
