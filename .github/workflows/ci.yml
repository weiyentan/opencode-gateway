name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opencode_gateway_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: |
          pip install -r requirements.txt
          pip install -e .

      - run: pytest --maxfail=5 -v -m "not integration"

      - name: Run AFK PostgreSQL integration tests
        env:
          GATEWAY_DATABASE_HOST: localhost
          GATEWAY_DATABASE_PORT: "5432"
          GATEWAY_DATABASE_NAME: opencode_gateway_test
          GATEWAY_DATABASE_USER: test
          GATEWAY_DATABASE_PASSWORD: test
        run: |
          set -euo pipefail
          pytest \
            tests/integration/test_afk_run_convergence.py \
            tests/integration/test_afk_outcomes_repository.py \
            -v -m integration 2>&1 | tee /tmp/afk-integration.log
          # 8 convergence + 20 repository = 28 integration tests must all pass.
          # The (^|[^0-9]) guard prevents a partial run (e.g. "8 passed, 20 skipped")
          # from silently satisfying the check.
          grep -Eq "(^|[^0-9])28 passed" /tmp/afk-integration.log

      - name: Lint Python
        run: ruff check .

      - name: Type-check application
        run: mypy app/ afk_outcomes/

      - name: Test frontend pure functions
        run: node frontend/tests/test_pure_functions.js
