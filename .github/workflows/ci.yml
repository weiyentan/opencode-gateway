name: CI

on:
  push:
    branches: [main, "ai/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opencode_gateway_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: pytest --maxfail=5 -v
        env:
          GATEWAY_DATABASE_HOST: localhost
          GATEWAY_DATABASE_PORT: "5432"
          GATEWAY_DATABASE_NAME: opencode_gateway_test
          GATEWAY_DATABASE_USER: test
          GATEWAY_DATABASE_PASSWORD: test
          GATEWAY_API_KEY: test-api-key
          GATEWAY_ENV: development
