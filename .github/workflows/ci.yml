name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opencode_gateway_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: |
          pip install -r requirements.txt
          pip install -e .

      - run: pytest --maxfail=5 -v -m "not integration"

      - name: Lint Python
        run: ruff check .

      - name: Type-check application
        run: mypy app/ afk_outcomes/

      - name: Test frontend pure functions
        run: node frontend/tests/test_pure_functions.js
