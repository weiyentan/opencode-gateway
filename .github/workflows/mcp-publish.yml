# ── Publish opencode-gateway-mcp to GHCR ───────────────────────────────────────
# Production container + CI publishing for the dedicated opencode-gateway-mcp
# adapter (issue #758, ADR 0031). The MCP is a read-only semantic adapter that
# communicates only with the published Gateway HTTP API — no direct Postgres,
# Kafka, AWX, or collector-database access.
#
# Pipeline: validate → build → smoke-start → publish to GHCR.
# - Validation (ruff / pytest v1 contract suite / forbidden-import check) runs
#   before any publish.
# - Build is multi-stage, non-root, runtime-only OPENCODE_GATEWAY_URL/API_KEY.
# - Smoke-start speaks the MCP protocol to the container over stdio and proves
#   the completed server exposes exactly the ten approved v1 tools; startup
#   failure fails the job and blocks publish.
# - Publish uses GHCR (ghcr.io) by default with immutable + branch/release tags.
# - No Postgres/Kafka/AWX services are required; the pipeline is independent of
#   systems behind the Gateway API boundary.
# ──────────────────────────────────────────────────────────────────────────────

name: Publish opencode-gateway-mcp

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

# GHCR is the default registry for the MCP image (issue #758).
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opencode-gateway-mcp

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate MCP project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install --no-cache-dir ruff

      - name: Lint MCP project
        run: |
          ruff check opencode-gateway-mcp/

      - name: Run MCP v1 contract suite (pytest)
        run: |
          pip install --no-cache-dir "./opencode-gateway-mcp[dev]"
          python -m pytest opencode-gateway-mcp/tests -q

      - name: Verify no Postgres/Kafka/AWX imports in MCP
        run: |
          set -euo pipefail
          if grep -r -E "import (asyncpg|aiokafka|confluent_kafka|psycopg|sqlalchemy|awxkit|kafka|redis|motor|boto3|pymongo)" opencode-gateway-mcp/ 2>/dev/null; then
            echo "error: MCP must not import Postgres/Kafka/AWX libraries" >&2
            exit 1
          fi
          if grep -r -E "OPENCODE_GATEWAY_API_KEY" opencode-gateway-mcp/Dockerfile 2>/dev/null | grep -q "ENV.*OPENCODE"; then
            echo "error: Dockerfile must not bake OPENCODE_GATEWAY_API_KEY" >&2
            exit 1
          fi
          echo "no forbidden coupling or baked secrets found"

  build-and-smoke:
    name: Build and smoke-test MCP image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Immutable revision (sha) + branch/release tags. Short SHA is the
          # immutable revision tag; semver tags are added for v* releases.
          tags: |
            type=sha,prefix=,format=short
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build MCP image (no push yet — smoke must pass first)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: opencode-gateway-mcp/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/opencode-gateway-mcp:smoke
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-start — fails closed without config
        run: |
          set -euo pipefail
          echo "Smoke: container must fail closed without OPENCODE_GATEWAY_URL/API_KEY"
          if docker run --rm ghcr.io/${{ github.repository_owner }}/opencode-gateway-mcp:smoke 2>&1; then
            echo "error: container should have exited non-zero without env" >&2
            exit 1
          fi
          echo "smoke without env correctly failed closed"

      - name: Smoke-start — MCP handshake exposes exactly the ten v1 tools
        run: |
          set -euo pipefail
          export SMOKE_IMAGE="ghcr.io/${{ github.repository_owner }}/opencode-gateway-mcp:smoke"
          export SMOKE_API_KEY="dummy-smoke-key-766"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import threading
          import time

          # The approved v1 read-only tool surface (ADR 0031). The container smoke
          # proves the published image starts the completed MCP server and exposes
          # exactly this set — no more, no less.
          EXPECTED_TOOLS = {
              "get_afk_activity_summary",
              "list_afk_runs",
              "list_change_requests",
              "get_afk_run_story",
              "get_model_usage",
              "get_agent_usage",
              "get_change_request_story",
              "get_gateway_health",
              "get_correlation_issues",
              "list_sessions",
          }

          image = os.environ["SMOKE_IMAGE"]
          api_key = os.environ["SMOKE_API_KEY"]

          proc = subprocess.Popen(
              [
                  "docker", "run", "--rm", "-i",
                  "-e", "OPENCODE_GATEWAY_URL=http://example.invalid",
                  "-e", f"OPENCODE_GATEWAY_API_KEY={api_key}",
                  image,
              ],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          def send(payload):
              assert proc.stdin is not None, "container stdin closed"
              proc.stdin.write(json.dumps(payload) + "\n")
              proc.stdin.flush()

          output = []

          def read_stdout():
              assert proc.stdout is not None, "container stdout closed"
              for line in proc.stdout:
                  output.append(line.strip())

          reader = threading.Thread(target=read_stdout, daemon=True)
          reader.start()

          send({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2025-06-18",
                  "capabilities": {},
                  "clientInfo": {"name": "mcp-smoke", "version": "1.0.0"},
              },
          })
          time.sleep(1)
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          time.sleep(0.5)
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}})

          tools = None
          deadline = time.time() + 30
          while time.time() < deadline:
              for line in list(output):
                  try:
                      obj = json.loads(line)
                  except (ValueError, TypeError):
                      continue
                  if isinstance(obj, dict) and obj.get("id") == 2:
                      tools = obj.get("result", {}).get("tools", [])
                      break
              if tools is not None:
                  break
              time.sleep(0.25)

          if proc.stdin is not None:
              proc.stdin.close()
          try:
              proc.wait(timeout=10)
          except subprocess.TimeoutExpired:
              proc.kill()
              proc.wait(timeout=10)
          stderr = proc.stderr.read() if proc.stderr is not None else ""

          if tools is None:
              sys.stderr.write("MCP tools/list handshake returned no tools\n")
              sys.stderr.write(stderr + "\n")
              sys.exit(1)
          names = {tool["name"] for tool in tools}
          if names != EXPECTED_TOOLS:
              sys.stderr.write(
                  f"tool surface mismatch: expected {sorted(EXPECTED_TOOLS)}, "
                  f"got {sorted(names)}\n"
              )
              sys.exit(1)
          if api_key in stderr or api_key in "\n".join(output):
              sys.stderr.write("API key leaked into container logs\n")
              sys.exit(1)
          print(
              f"smoke passed: container exposes exactly {len(names)} v1 tools, "
              "no secret in logs"
          )
          PY

      - name: Push MCP image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: opencode-gateway-mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
