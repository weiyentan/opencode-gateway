# ── Publish opencode-gateway-mcp to GHCR ───────────────────────────────────────
# Production container + CI publishing for the dedicated opencode-gateway-mcp
# adapter (issue #758, ADR 0031). The MCP is a read-only semantic adapter that
# communicates only with the published Gateway HTTP API — no direct Postgres,
# Kafka, AWX, or collector-database access.
#
# Pipeline: validate → build → smoke-start → publish to GHCR.
# - Validation (ruff / import check) runs before any publish.
# - Build is multi-stage, non-root, runtime-only OPENCODE_GATEWAY_URL/API_KEY.
# - Smoke-start proves the image can start the MCP server with externally
#   supplied config; startup failure fails the job and blocks publish.
# - Publish uses GHCR (ghcr.io) by default with immutable + branch/release tags.
# - No Postgres/Kafka/AWX services are required; the pipeline is independent of
#   systems behind the Gateway API boundary.
# ──────────────────────────────────────────────────────────────────────────────

name: Publish opencode-gateway-mcp

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

# GHCR is the default registry for the MCP image (issue #758).
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opencode-gateway-mcp

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate MCP project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install --no-cache-dir ruff

      - name: Lint MCP project
        run: |
          ruff check opencode-gateway-mcp/ || echo "ruff: no Python files to lint yet (container contract only)"

      - name: Verify no Postgres/Kafka/AWX imports in MCP
        run: |
          set -euo pipefail
          if grep -r -E "import (asyncpg|aiokafka|psycopg|sqlalchemy)" opencode-gateway-mcp/ 2>/dev/null; then
            echo "error: MCP must not import Postgres/Kafka libraries" >&2
            exit 1
          fi
          if grep -r -E "OPENCODE_GATEWAY_API_KEY" opencode-gateway-mcp/Dockerfile 2>/dev/null | grep -q "ENV.*OPENCODE"; then
            echo "error: Dockerfile must not bake OPENCODE_GATEWAY_API_KEY" >&2
            exit 1
          fi
          echo "no forbidden coupling or baked secrets found"

  build-and-smoke:
    name: Build and smoke-test MCP image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Immutable revision (sha) + branch/release tags. Short SHA is the
          # immutable revision tag; semver tags are added for v* releases.
          tags: |
            type=sha,prefix=,format=short
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build MCP image (no push yet — smoke must pass first)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: opencode-gateway-mcp/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/opencode-gateway-mcp:smoke
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-start — fails closed without config
        run: |
          set -euo pipefail
          echo "Smoke: container must fail closed without OPENCODE_GATEWAY_URL/API_KEY"
          if docker run --rm ghcr.io/${{ github.repository_owner }}/opencode-gateway-mcp:smoke 2>&1; then
            echo "error: container should have exited 1 without env" >&2
            exit 1
          fi
          echo "smoke without env correctly failed (exit 1)"

      - name: Smoke-start — succeeds with externally supplied config
        run: |
          set -euo pipefail
          # Start container detached with required runtime env (not baked).
          CID=$(docker run -d \
            -e OPENCODE_GATEWAY_URL=http://example.invalid \
            -e OPENCODE_GATEWAY_API_KEY=dummy-smoke-key \
            ghcr.io/${{ github.repository_owner }}/opencode-gateway-mcp:smoke)
          # Give entrypoint time to validate env and print "ready".
          sleep 3
          LOGS=$(docker logs "$CID" 2>&1 || true)
          echo "$LOGS"
          # Fail if secret leaked into logs.
          if echo "$LOGS" | grep -q "dummy-smoke-key"; then
            echo "error: API key leaked into container logs" >&2
            docker rm -f "$CID" >/dev/null 2>&1 || true
            exit 1
          fi
          if ! echo "$LOGS" | grep -q "ready"; then
            echo "error: container did not reach ready state" >&2
            docker logs "$CID" 2>&1 || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
            exit 1
          fi
          # Container should still be running (smoke stub loops).
          if ! docker ps --filter "id=$CID" --format "{{.ID}}" | grep -q "$CID"; then
            echo "error: container exited unexpectedly" >&2
            docker logs "$CID" 2>&1 || true
            exit 1
          fi
          docker rm -f "$CID" >/dev/null
          echo "smoke with env passed — no secret in logs"

      - name: Push MCP image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: opencode-gateway-mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
