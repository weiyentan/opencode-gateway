# ── Publish Gateway, Aurora Glass, and Consumer ───────────────────────────────
# Builds and publishes separate container images for the modules that
# together form the OpenCode Gateway observability platform:
#
#   Gateway      (root Dockerfile)             — Python/FastAPI REST API
#   Aurora Glass (frontend/Dockerfile)          — browser-based telemetry dashboard
#   Consumer     (Dockerfile.consumer)          — Kafka consumer for usage events
#
# All images are built from the same repository revision and receive
# identical version tags (semver, SHA) so they are always deployed together.
# On pull_request events the images are built but not pushed.
#
# Architecture: Gateway serves the observability API; Aurora Glass is a
# separate frontend that consumes the Gateway API — see CONTEXT.md.
# The Consumer runs independently, consuming Kafka messages and forwarding
# them to the Gateway ingest endpoint.
# ──────────────────────────────────────────────────────────────────────────────

name: Publish Gateway, Aurora Glass, and Consumer

on:
  push:
    branches: [ "master", "weiyentan-patch-1" ]
    tags: ["v*"]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: docker.io

jobs:
  # Single source of truth for the image build matrix. The `build` job derives
  # its matrix from this output and the `promote` job iterates the same image
  # names, so the two lists can never silently diverge. Add or remove an image
  # here only — no other place in this workflow hardcodes the image list.
  images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.define.outputs.matrix }}
    steps:
      - name: Define image matrix
        id: define
        run: |
          echo 'matrix=[{"name":"gateway","context":".","dockerfile":"Dockerfile"},{"name":"aurora-glass","context":".","dockerfile":"frontend/Dockerfile"},{"name":"consumer","context":".","dockerfile":"Dockerfile.consumer"}]' >> "$GITHUB_OUTPUT"

  build:
    needs: images
    runs-on: ubuntu-latest
    strategy:
      # A failed build must not prevent the other candidates from completing;
      # promotion is gated on the whole matrix succeeding below.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_IMAGE_NAME }}-${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ github.sha }}-candidate

      - name: Build candidate Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  promote:
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    needs: [images, build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Promote all candidate images
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGES_JSON: ${{ needs.images.outputs.matrix }}
        run: |
          set -euo pipefail

          # Pre-flight: every candidate image must exist before any release tag
          # is promoted, otherwise a missing candidate would still leave the
          # three images on different published revisions. With `set -e`, a
          # failed inspect aborts before the first promote tag is written.
          for image in $(echo "${IMAGES_JSON}" | jq -r '.[].name'); do
            docker buildx imagetools inspect \
              "${REGISTRY}/${IMAGE_NAME}-${image}:${COMMIT_SHA}-candidate" >/dev/null
          done

          # Promote only after the whole candidate set is confirmed present.
          # The promoted SHA tag is the 12-character short SHA, matching the
          # previous docker/metadata-action `type=sha,prefix=` behaviour; the
          # full SHA remains unique to the candidate tag.
          sha_tag="${COMMIT_SHA:0:12}"
          for image in $(echo "${IMAGES_JSON}" | jq -r '.[].name'); do
            source_image="${REGISTRY}/${IMAGE_NAME}-${image}:${COMMIT_SHA}-candidate"
            tags=("${REGISTRY}/${IMAGE_NAME}-${image}:${sha_tag}")

            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              version="${REF_NAME#v}"
              major_minor="${version%.*}"
              tags+=(
                "${REGISTRY}/${IMAGE_NAME}-${image}:${version}"
                "${REGISTRY}/${IMAGE_NAME}-${image}:${major_minor}"
              )
            fi

            for tag in "${tags[@]}"; do
              docker buildx imagetools create --tag "${tag}" "${source_image}"
            done
          done
