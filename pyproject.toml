[project]
name = "opencode-gateway"
version = "0.1.0"
description = "OpenCode Gateway — observability service for headless OpenCode"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["app*", "afk_outcomes*"]
exclude = ["alembic*", "frontend*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-m", "not profiling"]
markers = [
    "integration: tests that require Docker or a real PostgreSQL instance",
    "profiling: performance profiling benchmarks (measurement only, excluded from default CI runs)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Pre-existing modernization/style violations scoped for the CI-wiring PR (#532).
# These rules carry widespread pre-existing violations across the codebase that are
# tracked for future cleanup. The gate remains active for all other rules, including
# the F-rules that catch real bugs (unused imports, unused variables, redefinitions).
ignore = ["UP045", "UP007", "UP017", "UP035", "E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
# Pre-existing type debt scoped for the CI-wiring PR (#532).
# - ignore_missing_imports: asyncpg/aiokafka ship no type stubs (import-untyped noise).
# - disable_error_code type-arg: bare dict/list annotations are cosmetic, not bugs.
# - disable_error_code unused-ignore: the codebase carries stale `# type: ignore` comments.
# - overrides: modules with pre-existing type errors are scoped with ignore_errors=true
#   (tracked for future cleanup). The rest of the codebase remains strictly checked.
ignore_missing_imports = true
disable_error_code = ["type-arg", "unused-ignore"]

[[tool.mypy.overrides]]
module = [
  "app.core.reconciliation",
  "afk_outcomes.closure_episodes",
  "afk_outcomes.repository",
  "afk_outcomes.providers.gitlab",
  "app.api.usage",
  "app.api.ingest",
  "app.core.factory",
  "app.core.logging",
  "app.core.identity",
  "app.consumer.afk_consumer",
]
ignore_errors = true
